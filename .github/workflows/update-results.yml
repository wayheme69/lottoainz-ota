name: Update NZ Lotto results

on:
  schedule:
    # Tirages : mercredi 20:20 et samedi 20:00 (Pacific/Auckland = 07:20/07:00 UTC en été NZ) ; gains confirmés ensuite
    # → passages mer/sam 07:10-12:40 UTC, puis toutes les 6 h en filet de sécurité
    - cron: "10,40 7-12 * * 3,6"
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch results (official mylotto.co.nz API)
        run: python3 scripts/nz_results.py
      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "actions@github.com"
          git add nz_results.json history.json 2>/dev/null || git add nz_results.json
          if ! git diff --cached --quiet; then
            git commit -m "results: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          else
            echo "No change."
          fi
